name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # @iamthemcmaster/ui is a private package on the public npm registry.
      # .npmrc is gitignored; never commit one containing a token.
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install, typecheck, lint and test
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test

      - name: Smoke-test the agent package
        run: ./scripts/smoke-agent-package.sh
