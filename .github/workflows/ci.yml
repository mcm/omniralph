name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the changeset check can diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # @iamthemcmaster/ui is a private package on the public npm registry.
      # .npmrc is gitignored; never commit one containing a token.
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # A pull request that changes the agent, or a workspace package it bundles, must add a
      # changeset for @omniralph/agent (or an empty one). Not for the Version Packages pull
      # request, which consumes the changesets. See apps/agent/README.md › Releasing.
      - name: Check for an agent changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec tsx scripts/check-harness-changeset.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      # One turbo run, so typechecking and linting overlap the (database-bound) tests
      # rather than running one after the other.
      - name: Typecheck, lint and test
        run: pnpm turbo run typecheck lint test

      - name: Smoke-test the agent package
        run: ./scripts/smoke-agent-package.sh
