name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job runs in parallel on its own runner, so the run takes as long as the slowest one.
# The web and agent suites are the long ones, so they're split into shards.
jobs:
  check:
    name: Format, typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the changeset check can diff against the base branch.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      # A pull request that changes the agent, or a workspace package it bundles, must add a
      # changeset for @omniralph/agent (or an empty one). Not for the Version Packages pull
      # request, which consumes the changesets. See apps/agent/README.md › Releasing.
      - name: Check for an agent changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec tsx scripts/check-agent-changeset.ts "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck and lint
        run: pnpm turbo run typecheck lint

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web 1/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=1/6 }
          - { name: web 2/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=2/6 }
          - { name: web 3/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=3/6 }
          - { name: web 4/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=4/6 }
          - { name: web 5/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=5/6 }
          - { name: web 6/6, run: pnpm turbo run test --filter=@omniralph/web -- --shard=6/6 }
          - { name: agent 1/2, run: pnpm turbo run test --filter=@omniralph/agent -- --shard=1/2 }
          - { name: agent 2/2, run: pnpm turbo run test --filter=@omniralph/agent -- --shard=2/2 }
          - name: packages
            run: pnpm turbo run test --filter=!@omniralph/web --filter=!@omniralph/agent
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Test
        run: ${{ matrix.run }}

  smoke:
    name: Smoke-test the agent package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - run: ./scripts/smoke-agent-package.sh
