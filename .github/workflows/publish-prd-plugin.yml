name: Publish PRD plugin

# Publishes the omniralph-prd Claude plugin (see docs/prd-plugin.md): builds it from
# packages/planning with scripts/build-prd-plugin.ts into a checkout of its marketplace repo,
# mcm/omniralph-prd, and commits and pushes there only when the output changed.
# Runs on pushes to main only, never on pull requests.
#
# PRD_PLUGIN_DEPLOY_KEY is the private half of a deploy key with write access on
# mcm/omniralph-prd, stored as an Actions secret of this repo.
on:
  push:
    branches: [main]
  # Re-publishes main, e.g. after the secret is first added.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-prd-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The build script only needs the root's tooling (tsx): it imports packages/planning's
      # source by path.
      - name: Install
        run: pnpm install --frozen-lockfile --filter=omniralph

      - name: Check out mcm/omniralph-prd
        uses: actions/checkout@v4
        with:
          repository: mcm/omniralph-prd
          ssh-key: ${{ secrets.PRD_PLUGIN_DEPLOY_KEY }}
          path: omniralph-prd

      - name: Build the plugin
        run: pnpm exec tsx scripts/build-prd-plugin.ts --out omniralph-prd

      - name: Commit and push when the plugin changed
        working-directory: omniralph-prd
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "The plugin is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build from mcm/omniralph@${GITHUB_SHA::12}" \
            -m "Generated by publish-prd-plugin.yml from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push origin HEAD
