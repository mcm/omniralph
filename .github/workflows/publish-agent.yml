name: Publish agent

# Publishes @omniralph/agent through npm trusted publishing (OIDC).
# The trusted publisher on npmjs.com is registered against this filename: don't rename it.
on:
  push:
    tags: ["agent-v*.*.*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#agent-v}"
          package_version="$(node -p 'require("./apps/agent/package.json").version')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/agent/package.json version $package_version"
            exit 1
          fi

      # Only the agent and the workspace packages it bundles (plus the root's tooling) are
      # installed and checked: the web app, db and their Testcontainers suites aren't part of
      # the published package, and CI already covers them on main. This also skips the web
      # app's private @iamthemcmaster/ui dependency, so no npm token is needed to install.
      - name: Install
        run: pnpm install --frozen-lockfile --filter='@omniralph/agent...' --filter=omniralph

      - name: Typecheck, lint and test
        run: pnpm turbo run typecheck lint test --filter='@omniralph/agent...'

      # Builds (tsup, bundling the workspace packages from source), packs and smoke-tests the
      # package, keeping the tested tarball for the publish step.
      - name: Build, pack and smoke-test
        id: pack
        run: |
          ./scripts/smoke-agent-package.sh "$RUNNER_TEMP/pack"
          echo "tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN/NPM_TOKEN here: npm exchanges the job's OIDC token for a short-lived one.
      - name: Publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
